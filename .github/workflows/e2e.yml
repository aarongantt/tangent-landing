name: Landing E2E (Playwright)

# Drives the static marketing site with ALL external network blocked (the site
# embeds a live pk_live_ Stripe key + prod Supabase). No browser extension, so
# this runs headless — no xvfb needed. CI=true → retries:2 + forbidOnly.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  e2e:
    name: Playwright (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium
      - name: Run landing E2E
        run: npx playwright test --project=chromium
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: landing-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
